<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSJSGen</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="blazor-error-ui" style="display:none">
      Terjadi kesalahan. <a href="" class="reload">Muat ulang</a>
    </div>

    <!--
      Order matters. Components call window.csjsgen from their first OnAfterRenderAsync, so the
      helpers have to exist before Blazor starts rendering — otherwise those calls throw and
      everything after them in the same method is silently skipped.
    -->
    <script src="js/interop.js"></script>

    <!-- Monaco: the editor itself. Loaded before Blazor so the component can create it on first render. -->
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>

    <!-- No autostart="false": nothing else calls Blazor.start(), so the script self-starts. -->
    <script src="_framework/blazor.webview.js"></script>
  </body>
</html>
