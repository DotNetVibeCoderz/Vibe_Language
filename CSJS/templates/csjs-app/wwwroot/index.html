<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CsjsApp</title>
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>CsjsApp</h1>
        <p class="tagline">Written in <span class="cs">C#</span>, running as <span class="js">JavaScript</span>.</p>
      </header>

      <form id="add-form">
        <input id="new-task" placeholder="What needs doing?" autocomplete="off" />
        <button type="submit">Add</button>
      </form>

      <ul id="tasks"></ul>

      <footer>
        <span id="summary"></span>
        <button id="clear-done" type="button" class="quiet">Clear finished</button>
      </footer>
    </main>

    <script type="module">
      import { App } from './js/App.js';
      App.Start();
    </script>
  </body>
</html>
