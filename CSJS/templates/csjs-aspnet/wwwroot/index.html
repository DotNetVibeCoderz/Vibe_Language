<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSJS ASP.NET</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf8;
        --fg: #1a1917;
        --muted: #6b6862;
        --accent: #c2410c;
        --card: #ffffff;
        --border: #e7e3dc;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14130f; --fg: #f2efe9; --muted: #a39e94;
          --accent: #fb923c; --card: #1e1c17; --border: #302d26;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 3rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-items: start center;
      }

      .shell { width: min(58rem, 100%); }

      .eyebrow {
        font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--accent); font-weight: 600; margin: 0 0 0.4rem;
      }

      h1 { margin: 0 0 0.5rem; font-size: 1.875rem; letter-spacing: -0.02em; }
      .lede { margin: 0 0 2rem; color: var(--muted); line-height: 1.6; }

      .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }

      .filters button {
        font: inherit; font-size: 0.875rem; font-weight: 500;
        padding: 0.45rem 1rem;
        border: 1px solid var(--border); border-radius: 999px;
        background: transparent; color: var(--muted);
        cursor: pointer; transition: all 150ms ease;
      }

      .filters button:hover { border-color: var(--accent); color: var(--fg); }
      .filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
        gap: 1rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.85rem;
        padding: 1.25rem;
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgb(0 0 0 / 0.08); }
      .card h3 { margin: 0.6rem 0 0.4rem; font-size: 1rem; }

      .badge {
        display: inline-block;
        font-size: 0.6875rem; letter-spacing: 0.05em; text-transform: uppercase;
        font-weight: 600; color: var(--accent);
        background: color-mix(in oklab, var(--accent) 12%, transparent);
        padding: 0.2rem 0.55rem; border-radius: 999px;
      }

      .price { margin: 0; font-size: 1.125rem; font-weight: 600; font-variant-numeric: tabular-nums; }

      #status, #total { color: var(--muted); font-size: 0.875rem; }
      #total { margin-top: 1.5rem; }

      footer {
        margin-top: 2.5rem; padding-top: 1.25rem;
        border-top: 1px solid var(--border);
        font-size: 0.8125rem; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <p class="eyebrow">CSJS Template</p>
      <h1>ASP.NET + JS</h1>
      <p class="lede">
        Halaman ini dikendalikan oleh C# yang ditranspilasi ke JavaScript saat build.
        Data diambil dari endpoint <code>/api/products</code> milik server yang sama.
      </p>

      <div class="filters">
        <button data-filter="all">Semua</button>
        <button data-filter="kopi">Kopi</button>
        <button data-filter="teh">Teh</button>
        <button data-filter="pemanis">Pemanis</button>
      </div>

      <p id="status"></p>
      <div id="grid"></div>
      <p id="total"></p>

      <footer>Gravicode Studios — dipimpin oleh Kang Fadhil</footer>
    </div>

    <script type="module">
      import { App } from './js/App.js';
      App.Start();
    </script>
  </body>
</html>
